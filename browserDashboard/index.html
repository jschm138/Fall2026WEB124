<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Browser Info Dashboard</title>
  <script src="dashboard.js" defer></script>
</head>
<body>
  <main>
    <h2>Browser Info Dashboard</h2>
    <p>Enter your name and favorite website.</p>
    
    <form id="form" name="form">
      <input type="text" id="name" name="name" placeholder="Name">
      <input type="text" id="website" name="website" placeholder="https://website.com">
      <button type="submit" id="submitBtn" name="submitBtn">Submit</button>
    </form>

    <section id="output"></section>
  </main>
</body>
</html>
